name: Build Asterfall Windows game
on:
  push:
    branches: [main]
    paths: ['asterfall/**', '.github/workflows/asterfall.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asterfall-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install asset generator
        run: python -m pip install Pillow==12.0.0
      - name: Generate assets and build
        working-directory: asterfall
        run: |
          python fetch_dependencies.py
          python make_assets.py
          python build.py
      - name: Check loot, equipment, talents, saves and weather parsing
        working-directory: asterfall
        run: java -Duser.home="$RUNNER_TEMP/asterfall-checks" -jar asterfall.jar --self-test
      - name: Install software rendering test tools
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-xserver-utils libglu1-mesa libgl1-mesa-dri
      - name: Regress combat crash and render the game
        working-directory: asterfall
        env:
          ALSOFT_DRIVERS: 'null'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          command -v xrandr
          xvfb-run -a -s "-screen 0 1440x900x24" java -Duser.home="$RUNNER_TEMP/asterfall-combat" -cp 'asterfall.jar:lib/*' game.Desktop --combat-regression
          xvfb-run -a -s "-screen 0 1440x900x24" java -Duser.home="$RUNNER_TEMP/asterfall-smoke" -cp 'asterfall.jar:lib/*' game.Desktop --smoke
          python make_preview.py
      - name: Package game with bundled Windows Java
        working-directory: asterfall
        run: |
          python package_release.py
          cp ../preview-garden.png ../dist/Asterfall-Preview.png
          cp ../preview-night.png ../dist/Asterfall-Night.png
          cp ../preview-feel.gif ../dist/Asterfall-Feel.gif
      - uses: actions/upload-artifact@v4
        with:
          name: Asterfall-Windows-and-Source
          path: dist/*
          retention-days: 90
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=asterfall-v0.3.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Asterfall 0.3 — Lantern Garden presentation study" --notes-file asterfall/RELEASE.md --latest=false
          fi
